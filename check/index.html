<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check — Playhouse</title>
  <meta name="theme-color" content="#1a1612">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="sprite" aria-hidden="true" width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf7"/><stop offset=".55" stop-color="#f1e6d2"/><stop offset="1" stop-color="#cdb894"/>
    </linearGradient>
    <linearGradient id="ebony" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b4a3d"/><stop offset=".45" stop-color="#2a201a"/><stop offset="1" stop-color="#0e0a08"/>
    </linearGradient>
    <symbol id="pc-p" viewBox="0 0 45 45">
      <path d="M22.5 8.5a4.3 4.3 0 0 0-3.4 6.9 5.6 5.6 0 0 0-.3 9.2c-3.3 1.4-7.3 5.4-7.3 12.4h22c0-7-4-11-7.3-12.4a5.6 5.6 0 0 0-.3-9.2 4.3 4.3 0 0 0-3.4-6.9z"/>
      <path d="M10 39.5h25v-2.5H10z"/>
    </symbol>
    <symbol id="pc-r" viewBox="0 0 45 45">

      <path style="fill:none;stroke:var(--pd)" d="M15.5 20h14M15.5 29.8h14"/>
    </symbol>
    <symbol id="pc-b" viewBox="0 0 45 45">
      <path d="M9.5 39.5c3.6-1.1 9.6-.5 13-2.4 3.4 1.9 9.4 1.3 13 2.4v-2.2c-3.6-1.1-9.6-.5-13-2.4-3.4 1.9-9.4 1.3-13 2.4z"/>
      <path d="M15.5 33c2.5 2.3 11.5 2.3 14 0l-.4-2.6c-.3-1.7-2-3-2-3 4.8-2 5.6-10.8-4.6-15.2-10.2 4.4-9.4 13.2-4.6 15.2 0 0-1.7 1.3-2 3z"/>
      <circle cx="22.5" cy="9.3" r="2.6"/>
      <path style="fill:none;stroke:var(--pd)" d="M25.6 16.6l-4.4 4.6M18.5 30.6h8"/>
    </symbol>
    <symbol id="pc-n" viewBox="0 0 45 45">
      <path d="M10 39.5h25v-3H10z"/>
      <path d="M12.5 36.5h20.5c.3-7.4-1-12.4-3-16.4-1.7-3.4-2-6.6-.8-10.4-2.4-.1-4.4.8-5.8 2.3l-1.2-3.5-2.7 3.7c-4.3 1.4-7.4 4.8-8.8 9.6l-1.4 4.6c-.4 1.5.8 2.8 2.3 2.5l2.3-.5c1.8-.4 3.4-1.4 4.6-2.9l2.3-.4c-.1 3.6-2.6 5.9-5.6 8.3-2 1.6-2.7 3.1-2.7 3.1z"/>

      <path style="fill:none;stroke:var(--pd)" d="M14.6 28.6c5 -1.6 10.8-1.6 15.8 0"/>
    </symbol>
    <symbol id="pc-k" viewBox="0 0 45 45">
      <path d="M10 39.5h25v-3H10z"/>
      <path d="M12.3 36.5h20.4l-1.4-4.6H13.7z"/>

      <path d="M22.5 25.4c-1.2-3.6-2.6-6-2.6-8 0-1.8 1.2-3.2 2.6-3.6 1.4.4 2.6 1.8 2.6 3.6 0 2-1.4 4.4-2.6 8z"/>
      <path d="M21.2 13.7V10.3h-3V7.7h3V4.6h2.6v3.1h3v2.6h-3v3.4z"/>
      <path style="fill:none;stroke:var(--pd)" d="M14.6 28.6c5-1.6 10.8-1.6 15.8 0"/>
    </symbol>
  </defs>
</svg>
  <div class="app">
    <main class="stage">
      <div class="board-col">
        <div class="player" id="pTop">
          <span class="avatar"></span>
          <div class="who"><strong class="name"></strong><span class="caps"></span></div>
          <span class="adv"></span>
        </div>
        <div class="frame">
          <div class="board" id="board" role="grid" aria-label="Chessboard"></div>
        </div>
        <div class="player" id="pBot">
          <span class="avatar"></span>
          <div class="who"><strong class="name"></strong><span class="caps"></span></div>
          <span class="adv"></span>
        </div>
      </div>
    </main>

    <aside class="side">
      <div class="top">
        <a class="back" href="../" aria-label="Back to Playhouse">‹</a>
        <h1>Check</h1>
        <button type="button" id="full" class="icon-btn" title="Full screen" aria-label="Full screen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
      </div>

      <p id="status">White to move</p>

      <div class="seg" role="group" aria-label="Who plays">
        <button id="modeAi" class="on" type="button">Vs house</button>
        <button id="modeHot" type="button">Pass &amp; play</button>
      </div>
      <div class="seg" id="colors" role="group" aria-label="Your colour">
        <button type="button" data-color="w" class="on">White</button>
        <button type="button" data-color="b">Black</button>
      </div>

      <div class="log-head"><span>Moves</span></div>
      <ol id="log"></ol>

      <div class="actions">
        <button type="button" id="undo" class="icon-btn" title="Undo" aria-label="Undo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </button>
        <button type="button" id="sound" class="icon-btn" aria-pressed="true" title="Sound" aria-label="Sound">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="mute" d="M16 9l6 6M22 9l-6 6"/></svg>
        </button>
        <button type="button" id="fresh" class="primary">New game</button>
      </div>
      <p class="foot">Castling, en passant and promotion included. The house looks three moves ahead.</p>
    </aside>
  </div>

  <div class="overlay" id="promo" hidden>
    <div class="sheet" role="dialog" aria-label="Promote pawn">
      <h2>Promote to</h2>
      <div class="choices" id="promoChoices"></div>
    </div>
  </div>

  <div class="overlay" id="end" hidden>
    <div class="sheet">
      <svg class="end-piece" id="endPiece" aria-hidden="true"><use href="#pc-k"/></svg>
      <p class="kicker" id="endKicker">Game over</p>
      <h2 id="endTitle">Checkmate</h2>
      <p id="endText"></p>
      <button type="button" id="endAgain" class="primary">Play again</button>
    </div>
  </div>

  <script src="engine.js"></script>
  <script src="game.js"></script>
</body>
</html>
